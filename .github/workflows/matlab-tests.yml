name: MATLAB Tests

on:
  push:
    branches: [main, Devs]
  pull_request:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Debug license env
        run: echo "MW_PAT is set = ${{ secrets.MW_PAT != '' }}"

      - name: Check environment
        run: |
          whoami
          echo %TEMP%
          echo %PATH%
          git --version
      
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: MATLAB
          install-system-dependencies: true
      
      - name: Run MATLAB tests
        run: matlab -batch "addpath(genpath('Development')); results = runtests('Tests'); exit(~all([results.Passed]));"



