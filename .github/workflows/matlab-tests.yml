name: MATLAB Tests

on:
  push:
    branches: [main, Devs]
  pull_request:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------------
      # Debug (optional but useful)
      # ----------------------------
      - name: Check environment
        shell: powershell
        run: |
          whoami
          echo $env:PATH
          where matlab
          git --version

      - name: Check MATLAB version
        shell: powershell
        run: |
          matlab -batch "ver"

      # ----------------------------
      # Run MATLAB tests
      # ----------------------------
      - name: Run MATLAB tests
        shell: powershell
        env:
          MW_PAT: ${{ secrets.MW_PAT }}
        run: |
          $env:MW_PAT = "${{ secrets.MW_PAT }}"

          matlab -batch "addpath(genpath('Development')); results = runtests('Tests'); exit(~all([results.Passed]));"


